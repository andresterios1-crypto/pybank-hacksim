{% extends "base.html" %}
{% block title %}Transfer · PyBank{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Send money</h1>
    <p class="muted">Your balance: <strong>{{ user.balance_cents | money }}</strong></p>

    <form method="POST" action="{{ url_for('transfer') }}" id="transfer-form">
        <label for="to">Recipient</label>
        <select id="to" name="to" required>
            <option value="">Choose a user…</option>
            {% for o in others %}
            <option value="{{ o.username }}">{{ o.full_name }} ({{ o.username }})</option>
            {% endfor %}
        </select>

        <label for="amount">Amount ($)</label>
        <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>

        <label for="note">Note (optional)</label>
        <input type="text" id="note" name="note" maxlength="100" placeholder="What's it for?">

        <button type="submit">Send</button>
    </form>
</div>
{% endblock %}
